<text x="75" y="1144" style="font-size:18px;fill:#152c41">Old foot [-.050, -.020] is inside the board, not under it.</text>
<text x="75" y="1168" style="font-size:18px;fill:#152c41">Upper washer [-.152, -.140] and shaft to -.180 reach the underside.</text>
<text x="75" y="1192" style="font-size:18px;fill:#152c41">Accepted lower caps are visible .130-wide parts; no dedicated cap collider.</text>
<text x="75" y="1216" style="font-size:18px;fill:#152c41">No drawing here certifies holes, load paths or whole-candidate acceptance.</text>
